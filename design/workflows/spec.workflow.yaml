schema: workflow/v1
id: spec-generation
version: 1
shortcode: SGEN
invoke: specify-invocation
policy: core.specification-output@1
start: toolchain
resources:
  protocol-prompt: spec/protocol.prompt.md
  extraction-prompt: spec/extraction.prompt.md
  extraction-schema: spec/extraction.schema.json
  reconciliation-prompt: spec/reconciliation.prompt.md
  reconciliation-schema: spec/reconciliation.schema.json
  generation-prompt: spec/generation.prompt.md
  generation-schema: spec/generation.schema.json
  repair-prompt: spec/repair.prompt.md
  repair-schema: spec/repair.schema.json
  support-prompt: spec/support.prompt.md
  support-schema: spec/support.schema.json
steps:
  toolchain:
    call: prepare-toolchain
    on:
      ok: inputs
      failed: end.failed
  inputs:
    call: prepare-inputs
    on:
      ok: references
      failed: end.failed
  references:
    call: prepare-references
    on:
      ok: extract
      failed: end.failed
  extract:
    call: extract-references
    on:
      ok: reconcile
      invalid: end.invalid
      blocked: end.blocked
      failed: end.failed
      cancelled: end.cancelled
  reconcile:
    call: reconcile-references
    on:
      ok: check-references
      invalid: end.invalid
      blocked: end.blocked
      failed: end.failed
      cancelled: end.cancelled
  check-references:
    use: validate-reference-reconciliation-completeness
    on:
      ok: review-source
      blocked: review-source
      failed: end.failed
  review-source:
    call: review-support
    on:
      ok: source-authority
      invalid: end.invalid
      blocked: end.blocked
      failed: end.failed
      cancelled: end.cancelled
  source-authority:
    call: authority-gate
    on:
      ok: generate
      invalid: end.invalid
      needs-user: source-gaps
      blocked: end.blocked
      failed: end.failed
  generate:
    call: generate-specification
    on:
      ok: review-content
      invalid: end.invalid
      needs-user: generation-gaps
      blocked: end.blocked
      failed: end.failed
      cancelled: end.cancelled
  review-content:
    call: review-specification
    on:
      ok: publish
      invalid: end.invalid
      needs-user: candidate-gaps
      blocked: end.blocked
      failed: end.failed
      cancelled: end.cancelled
  publish:
    call: publish-specification
    on:
      ok: end.ok
      needs-user: end.needs-user
      blocked: end.blocked
      failed: end.failed
  source-gaps:
    call: authority-clarifications
    on:
      ok: end.ok
      needs-user: end.needs-user
      blocked: end.blocked
      failed: end.failed
  candidate-gaps:
    call: authority-clarifications
    on:
      ok: end.ok
      needs-user: end.needs-user
      blocked: end.blocked
      failed: end.failed
  generation-gaps:
    call: generation-clarifications
    on:
      ok: end.ok
      needs-user: end.needs-user
      blocked: end.blocked
      failed: end.failed
subgraphs:
  prepare-toolchain:
    start: capture-project
    steps:
      capture-project:
        use: capture-project-toolchain
        on: {ok: inventory-presets, failed: end.failed}
      inventory-presets:
        use: inventory-toolchain-presets
        on: {ok: capture-presets, failed: end.failed}
      capture-presets:
        use: capture-toolchain-presets
        on: {ok: parse-toolchain, failed: end.failed}
      parse-toolchain:
        use: parse-toolchain-documents
        on: {ok: validate-project, failed: end.failed}
      validate-project:
        use: validate-project-toolchain-schema
        on: {ok: validate-registry, failed: end.failed}
      validate-registry:
        use: validate-toolchain-preset-registry
        on: {ok: inherit, failed: end.failed}
      inherit:
        use: resolve-toolchain-inheritance
        on: {ok: compose, failed: end.failed}
      compose:
        use: compose-toolchain
        on: {ok: validate-safety, failed: end.failed}
      validate-safety:
        use: validate-toolchain-safety
        on: {ok: end.ok, failed: end.failed}
  prepare-inputs:
    start: normalize-feature
    steps:
      normalize-feature:
        use: normalize-feature-directory
        on: {ok: validate-feature, failed: end.failed}
      validate-feature:
        use: validate-feature-directory
        on: {ok: inspect-feature, failed: end.failed}
      inspect-feature:
        use: inspect-feature-directory
        on: {ok: normalize-reference, failed: end.failed}
      normalize-reference:
        use: normalize-reference-selector
        on: {ok: validate-reference, failed: end.failed}
      validate-reference:
        use: validate-reference-selector
        on: {ok: inspect-reference, failed: end.failed}
      inspect-reference:
        use: inspect-reference-directory
        on: {ok: resolve-paths, failed: end.failed}
      resolve-paths:
        use: resolve-feature-artifact-paths
        on: {ok: capture-workflow-state, failed: end.failed}
      capture-workflow-state:
        use: capture-workflow-state
        on: {ok: parse-specification-state, failed: end.failed}
      parse-specification-state:
        use: parse-specification-state
        on: {ok: capture-clarifications, failed: end.failed}
      capture-clarifications:
        use: capture-clarification-inputs
        on: {ok: parse-state, failed: end.failed}
      parse-state:
        use: parse-clarification-state
        on: {ok: validate-state, failed: end.failed}
      validate-state:
        use: validate-clarification-state
        on: {ok: validate-forms, failed: end.failed}
      validate-forms:
        use: validate-clarification-forms
        on: {ok: end.ok, failed: end.failed}
  prepare-references:
    start: inventory-references
    steps:
      inventory-references:
        use: inventory-reference-sources
        on: {ok: validate-inventory, failed: end.failed}
      validate-inventory:
        use: validate-reference-inventory
        on: {ok: capture-references, failed: end.failed}
      capture-references:
        use: capture-reference-sources
        on: {ok: decode-references, failed: end.failed}
      decode-references:
        use: decode-reference-markdown
        on: {ok: validate-accounting, failed: end.failed}
      validate-accounting:
        use: validate-reference-accounting
        on: {ok: identify-references, failed: end.failed}
      identify-references:
        use: assign-reference-identities
        on: {ok: build-chunks, failed: end.failed}
      build-chunks:
        use: build-reference-chunks
        on: {ok: validate-chunks, failed: end.failed}
      validate-chunks:
        use: validate-reference-chunks
        on: {ok: compile-naming, failed: end.failed}
      compile-naming:
        use: compile-naming-policy
        on: {ok: build-grammar, failed: end.failed}
      build-grammar:
        use: build-superset-path-token-grammar
        on: {ok: scan-literals, failed: end.failed}
      scan-literals:
        use: scan-reference-passive-literals
        on: {ok: assign-literals, failed: end.failed}
      assign-literals:
        use: assign-passive-literal-identities
        on: {ok: validate-literals, failed: end.failed}
      validate-literals:
        use: validate-reference-passive-literals
        on: {ok: extract-facts, failed: end.failed}
      extract-facts:
        use: extract-structured-reference-facts
        on: {ok: identify-tokens, failed: end.failed}
      identify-tokens:
        use: assign-structured-token-candidate-identities
        on: {ok: end.ok, failed: end.failed}
  extract-references:
    start: initialize-requests
    steps:
      initialize-requests:
        use: build-initial-model-request-identity-ledger
        on: {ok: initialize-extraction, failed: end.failed}
      initialize-extraction:
        use: initialize-reference-extraction
        on: {ok: check-extraction, failed: end.failed}
      check-extraction:
        use: check-reference-extraction-progress
        on: {ok: finish-extraction, more: extraction-packet, failed: end.failed}
      extraction-packet:
        use: build-reference-extraction-model-input
        on: {ok: ex, failed: end.failed}
      ex:
        call: model-request
        with:
          prompt: extraction-prompt
          schema: extraction-schema
          selection: resource
          retry-limit: 128
        on: {ok: collect-extraction, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      collect-extraction:
        use: collect-reference-extraction-result
        on: {ok: ex-release, failed: end.failed}
      ex-release:
        call: release-request
        on: {ok: check-extraction, failed: end.failed}
      finish-extraction:
        use: build-reference-extraction-results
        on: {ok: parse-extraction, failed: end.failed}
      parse-extraction:
        use: parse-reference-extraction-results
        on: {ok: validate-extraction-text, failed: end.failed}
      validate-extraction-text:
        use: validate-reference-extraction-text
        on: {ok: validate-selections, invalid: authorize-text-repair, failed: end.failed}
      authorize-text-repair:
        use: authorize-reference-text-repair
        on: {ok: text-repair-input, invalid: end.invalid, failed: end.failed}
      text-repair-input:
        use: build-reference-text-repair-input
        on: {ok: text-repair, failed: end.failed}
      text-repair:
        call: model-request
        with:
          prompt: repair-prompt
          schema: extraction-schema
          selection: input
          retry-limit: 1
        on: {ok: parse-text-repair, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse-text-repair:
        use: parse-reference-text-repair
        on: {ok: merge-text-repair, invalid: end.invalid, failed: end.failed}
      merge-text-repair:
        use: merge-reference-text-repair
        on: {ok: text-repair-release, invalid: end.invalid, failed: end.failed}
      text-repair-release:
        call: release-request
        on: {ok: validate-extraction-text, failed: end.failed}
      validate-selections:
        use: validate-reference-selections
        on: {ok: assign-tokens, invalid: authorize-extraction-repair, failed: end.failed}
      authorize-extraction-repair:
        use: authorize-reference-extraction-repair
        on: {ok: extraction-repair-input, invalid: end.invalid, failed: end.failed}
      extraction-repair-input:
        use: build-reference-extraction-repair-input
        on: {ok: extraction-repair, failed: end.failed}
      extraction-repair:
        call: model-request
        with:
          prompt: repair-prompt
          schema: extraction-schema
          selection: input
          retry-limit: 1
        on: {ok: parse-extraction-repair, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse-extraction-repair:
        use: parse-reference-extraction-repair
        on: {ok: merge-extraction-repair, invalid: end.invalid, failed: end.failed}
      merge-extraction-repair:
        use: merge-reference-extraction-repair
        on: {ok: extraction-repair-release, invalid: end.invalid, failed: end.failed}
      extraction-repair-release:
        call: release-request
        on: {ok: validate-selections, failed: end.failed}
      assign-tokens:
        use: assign-preserved-token-identities
        on: {ok: build-token-claims, failed: end.failed}
      build-token-claims:
        use: build-preserved-token-claims
        on: {ok: validate-claims, failed: end.failed}
      validate-claims:
        use: validate-reference-claims
        on: {ok: assign-claims, invalid: retain-claim-rejection, failed: end.failed}
      retain-claim-rejection:
        use: retain-reference-claim-rejection
        on: {ok: authorize-extraction-repair, failed: end.failed}
      assign-claims:
        use: assign-reference-claim-identities
        on: {ok: build-ledger, failed: end.failed}
      build-ledger:
        use: build-reference-extraction-ledger
        on: {ok: account-extraction, failed: end.failed}
      account-extraction:
        use: validate-reference-extraction-accounting
        on: {ok: end.ok, blocked: end.blocked, failed: end.failed}
  reconcile-references:
    start: build-reconciliation
    steps:
      build-reconciliation:
        use: build-reference-reconciliation-items
        on: {ok: partition-reconciliation, failed: end.failed}
      partition-reconciliation:
        use: partition-reference-reconciliation-items
        with:
          group-size: 8
        on: {ok: assign-partitions, failed: end.failed}
      assign-partitions:
        use: assign-reference-reconciliation-partitions
        on: {ok: validate-partitions, failed: end.failed}
      validate-partitions:
        use: validate-reference-reconciliation-partitions
        on: {ok: reconciliation-input, failed: end.failed}
      reconciliation-input:
        use: build-reference-reconciliation-input
        on: {ok: reconciliation-packet, failed: end.failed}
      reconciliation-packet:
        use: build-reference-reconciliation-model-input
        on: {ok: rc, failed: end.failed}
      rc:
        call: model-request
        with:
          prompt: reconciliation-prompt
          schema: reconciliation-schema
          selection: input
          retry-limit: 128
        on: {ok: collect-reconciliation, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      collect-reconciliation:
        use: collect-reference-reconciliation-result
        on: {ok: rc-release, failed: end.failed}
      rc-release:
        call: release-request
        on: {ok: parse-reconciliation, failed: end.failed}
      parse-reconciliation:
        use: parse-reference-reconciliation-result
        on: {ok: check-reconciliation, failed: end.failed}
      check-reconciliation:
        use: check-reference-reconciliation-purpose
        on: {ok: validate-dispositions, more: validate-summary, failed: end.failed}
      validate-summary:
        use: validate-reference-reconciliation-summary
        on: {ok: assign-summary, invalid: authorize-summary-repair, failed: end.failed}
      assign-summary:
        use: assign-reference-summary-identities
        on: {ok: build-summary, failed: end.failed}
      build-summary:
        use: build-reference-reconciliation-summary
        on: {ok: reconciliation-input, failed: end.failed}
      validate-dispositions:
        use: validate-reference-claim-dispositions
        on: {ok: validate-signals, invalid: authorize-dispositions-repair, failed: end.failed}
      validate-signals:
        use: validate-reference-signal-proposals
        on: {ok: validate-conflicts, invalid: authorize-signals-repair, failed: end.failed}
      validate-conflicts:
        use: validate-reference-conflict-proposals
        on: {ok: assign-records, invalid: authorize-conflicts-repair, failed: end.failed}
      authorize-summary-repair:
        use: authorize-reference-summary-repair
        on: {ok: reconciliation-repair-input, more: merge-reconciliation-repair, blocked: end.blocked, failed: end.failed}
      authorize-dispositions-repair:
        use: authorize-reference-dispositions-repair
        on: {ok: reconciliation-repair-input, more: merge-reconciliation-repair, blocked: end.blocked, failed: end.failed}
      authorize-signals-repair:
        use: authorize-reference-signals-repair
        on: {ok: reconciliation-repair-input, more: merge-reconciliation-repair, blocked: end.blocked, failed: end.failed}
      authorize-conflicts-repair:
        use: authorize-reference-conflicts-repair
        on: {ok: reconciliation-repair-input, more: merge-reconciliation-repair, blocked: end.blocked, failed: end.failed}
      reconciliation-repair-input:
        use: build-reference-reconciliation-repair-input
        on: {ok: reconciliation-repair, failed: end.failed}
      reconciliation-repair:
        call: model-request
        with:
          prompt: repair-prompt
          schema: reconciliation-schema
          selection: input
          retry-limit: 1
        on: {ok: parse-reconciliation-repair, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse-reconciliation-repair:
        use: parse-reference-reconciliation-repair
        on: {ok: reconciliation-repair-release, failed: end.failed}
      merge-reconciliation-repair:
        use: merge-reference-reconciliation-repair
        with:
          retry-limit: 128
        on: {ok: check-reconciliation, failed: end.failed}
      reconciliation-repair-release:
        call: release-request
        on: {ok: merge-reconciliation-repair, failed: end.failed}
      assign-records:
        use: assign-reference-reconciliation-identities
        on: {ok: build-records, failed: end.failed}
      build-records:
        use: build-reference-reconciliation-records
        on: {ok: end.ok, failed: end.failed}
  review-support:
    start: project
    steps:
      project:
        use: build-specification-authority-requirements
        on: {ok: input, blocked: end.blocked}
      input:
        use: build-specification-support-input
        on: {ok: model, failed: end.failed}
      model:
        call: model-request
        with:
          prompt: support-prompt
          schema: support-schema
          selection: input
          retry-limit: 1
        on: {ok: collect, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      collect:
        use: collect-specification-support
        on: {ok: release, invalid: authorize, failed: end.failed}
      release:
        call: release-request
        on: {ok: apply, failed: end.failed}
      apply:
        use: apply-specification-support
        on: {ok: end.ok, failed: end.failed}
      authorize:
        use: authorize-specification-support-repair
        on: {ok: retire, more: merge, blocked: end.blocked, failed: end.failed}
      retire:
        call: release-request
        on: {ok: repair-input, failed: end.failed}
      repair-input:
        use: build-specification-support-repair-input
        on: {ok: repair, failed: end.failed}
      repair:
        call: model-request
        with:
          prompt: repair-prompt
          schema: support-schema
          selection: input
          retry-limit: 1
        on: {ok: parse, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse:
        use: parse-specification-support-repair
        on: {ok: merge, failed: end.failed}
      merge:
        use: merge-specification-support-repair
        with:
          retry-limit: 2
        on: {ok: release, invalid: authorize, failed: end.failed}
  generate-specification:
    start: initialize-specification
    steps:
      initialize-specification:
        use: initialize-specification-generation
        on: {ok: check-specification, failed: end.failed}
      check-specification:
        use: check-specification-generation-progress
        on: {ok: retire-pre-authority, more: generation-input, failed: end.failed}
      generation-input:
        use: build-specification-model-input
        on: {ok: gen, failed: end.failed}
      gen:
        call: model-request
        with:
          prompt: generation-prompt
          schema: generation-schema
          selection: input
          retry-limit: 64
        on: {ok: collect-specification, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      collect-specification:
        use: collect-specification-model-result
        on: {ok: parse-specification, failed: end.failed}
      parse-specification:
        use: parse-specification-unit
        on: {ok: gen-release, invalid: end.invalid, failed: end.failed}
      validate-specification:
        use: validate-specification-unit
        on: {ok: advance-specification, invalid: authorize-repair, needs-user: end.needs-user, failed: end.failed}
      advance-specification:
        use: advance-specification-generation
        on: {ok: check-specification, failed: end.failed}
      gen-release:
        call: release-request
        on: {ok: validate-specification, failed: end.failed}
      authorize-repair:
        use: authorize-specification-repair
        on: {ok: repair-input, more: merge-repair, invalid: end.invalid, blocked: end.blocked, failed: end.failed}
      repair-input:
        use: build-specification-repair-input
        on: {ok: repair, failed: end.failed}
      repair:
        call: model-request
        with:
          prompt: repair-prompt
          schema: repair-schema
          selection: input
          retry-limit: 1
        on: {ok: parse-repair, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse-repair:
        use: parse-specification-repair
        on: {ok: repair-release, failed: end.failed}
      merge-repair:
        use: merge-specification-repair
        with:
          retry-limit: 64
        on: {ok: validate-specification, failed: end.failed}
      repair-release:
        call: release-request
        on: {ok: merge-repair, failed: end.failed}
      retire-pre-authority:
        use: retire-required-authority-projection
        on: {ok: end.ok, failed: end.failed}
  review-specification:
    start: assemble-specification
    steps:
      assemble-specification:
        use: assemble-specification-content
        on: {ok: validate-coverage, failed: end.failed}
      validate-coverage:
        use: validate-specification-coverage
        on: {ok: post, invalid: authorize-coverage-repair, failed: end.failed}
      authorize-coverage-repair:
        use: authorize-specification-coverage-repair
        on: {ok: merge-coverage-repair, blocked: end.blocked, failed: end.failed}
      merge-coverage-repair:
        use: merge-specification-coverage-repair
        with:
          retry-limit: 64
        on: {ok: assemble-specification, failed: end.failed}
      post:
        call: review-support
        on: {ok: gate, invalid: end.invalid, blocked: end.blocked, failed: end.failed, cancelled: end.cancelled}
      omit:
        call: repair-omission
        on:
          ok: assemble-specification
          invalid: end.invalid
          blocked: end.blocked
          failed: end.failed
          cancelled: end.cancelled
      gate:
        call: authority-gate
        on: {ok: end.ok, invalid: omit, needs-user: end.needs-user, blocked: end.blocked, failed: end.failed}
  publish-specification:
    start: project-document
    steps:
      project-document:
        use: project-specification-document
        on: {ok: render-specification, failed: end.failed}
      render-specification:
        use: render-specification
        on: {ok: validate-rendering, failed: end.failed}
      validate-rendering:
        use: validate-specification-rendering
        on: {ok: resolved-clarification-needs, failed: end.failed}
      resolved-clarification-needs:
        use: build-resolved-clarification-needs
        on: {ok: refresh-output-clarifications, failed: end.failed}
      refresh-output-clarifications:
        use: refresh-clarifications
        on: {ok: check-output-clarifications, blocked: end.blocked, failed: end.failed}
      check-output-clarifications:
        use: check-clarification-progress
        on: {ok: render-output-clarifications, needs-user: publish-pending-clarifications, blocked: end.blocked}
      render-output-clarifications:
        use: render-clarification-forms
        on: {ok: build-reference-snapshot, failed: end.failed}
      build-reference-snapshot:
        use: build-reference-snapshot
        on: {ok: build-specification-state, failed: end.failed}
      build-specification-state:
        use: build-specification-state
        on: {ok: render-reference-context, failed: end.failed}
      render-reference-context:
        use: render-reference-context
        on: {ok: prepare-specification-output, failed: end.failed}
      prepare-specification-output:
        use: prepare-specification-output
        on: {ok: publish-specification, failed: end.failed}
      publish-specification:
        use: publish-workflow-output
        on: {ok: end.ok, failed: end.failed}
      publish-pending-clarifications:
        call: clarification-output
        on: {ok: end.ok, needs-user: end.needs-user, blocked: end.blocked, failed: end.failed}
  model-request:
    start: assign
    steps:
      assign:
        use: assign-model-request-id
        with:
          slot: spec_generation
          response-mode: prompt-only
          protocol-prompt: protocol-prompt
          prompt: {param: prompt}
          result-schema: {param: schema}
          result-selection: {param: selection}
        on: {ok: validate, failed: end.failed}
      validate:
        use: validate-model-request-binding
        on: {ok: build, failed: end.failed}
      build:
        use: build-model-request
        on: {ok: account, failed: end.failed}
      account:
        use: advance-model-attempt-accounting
        with:
          retry-limit: {param: retry-limit}
        on: {ok: operation, failed: end.failed}
      operation:
        use: assign-provider-operation
        with:
          kind: inference
        on: {ok: authorize, failed: end.failed}
      authorize:
        use: prepare-provider-operation-authorization
        with:
          timeout-ms: 60000
        on: {ok: phase, failed: terminate-operation, cancelled: terminate-operation}
      phase:
        use: check-model-request-phase
        on: {ok: advance-request, more: advance-operation, failed: end.failed}
      advance-request:
        use: advance-model-request-lifecycle
        with:
          transition: invoked
        on: {ok: advance-operation, failed: end.failed}
      advance-operation:
        use: advance-provider-operation-lifecycle
        with:
          transition: invoked
        on: {ok: call, failed: end.failed}
      call:
        use: invoke-model
        on: {ok: observation, failed: observation, cancelled: observation}
      observation:
        use: validate-provider-invocation-observation
        on: {ok: complete-operation, failed: complete-operation, cancelled: complete-operation}
      complete-operation:
        use: complete-provider-operation
        on: {ok: decode, failed: decode, cancelled: decode}
      decode:
        use: decode-model-envelope
        on: {ok: payload, invalid: payload, failed: payload, cancelled: payload}
      payload:
        use: validate-model-payload-schema
        on: {ok: close, invalid: retry, failed: close, cancelled: close}
      retry:
        use: build-model-protocol-retry
        on: {ok: account, failed: end.failed}
      close:
        use: complete-model-request
        on: {ok: end.ok, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      terminate-operation:
        use: terminate-provider-operation
        on: {failed: terminate-request, cancelled: terminate-request}
      terminate-request:
        use: terminate-model-request
        on: {failed: end.failed, cancelled: end.cancelled}
  release-request:
    start: input
    steps:
      input:
        use: retire-model-input
        on: {ok: request, failed: end.failed}
      request:
        use: retire-model-request
        on: {ok: end.ok, failed: end.failed}
  authority-gate:
    start: ledger
    steps:
      ledger:
        use: build-required-authority-ledger
        on: {ok: observations, blocked: end.blocked}
      observations:
        use: build-required-authority-observations
        on: {ok: reconcile, failed: end.failed}
      reconcile:
        use: reconcile-required-authorities
        on: {ok: gate, invalid: gate, needs-user: gate, blocked: gate}
      gate:
        use: validate-required-authority-reconciliation
        on: {ok: end.ok, invalid: end.invalid, needs-user: end.needs-user, blocked: end.blocked}
  clarification-output:
    start: render
    steps:
      render:
        use: render-clarification-forms
        on: {ok: prepare, failed: end.failed}
      prepare:
        use: prepare-clarification-output
        on: {ok: publish, failed: end.failed}
      publish:
        use: publish-workflow-output
        on: {ok: check, failed: end.failed}
      check:
        use: check-clarification-progress
        on: {ok: end.ok, needs-user: end.needs-user, blocked: end.blocked}
  authority-clarifications:
    start: needs
    steps:
      needs:
        use: build-required-authority-clarification-needs
        on: {ok: refresh, blocked: end.blocked, failed: end.failed}
      refresh:
        use: refresh-clarifications
        on: {ok: output, blocked: end.blocked, failed: end.failed}
      output:
        call: clarification-output
        on: {ok: end.ok, needs-user: end.needs-user, blocked: end.blocked, failed: end.failed}
  repair-omission:
    start: authorize
    steps:
      authorize:
        use: authorize-specification-omission-repair
        on: {ok: input, blocked: end.blocked, failed: end.failed}
      input:
        use: build-specification-omission-repair-input
        on: {ok: model, failed: end.failed}
      model:
        call: model-request
        with:
          prompt: repair-prompt
          schema: repair-schema
          selection: input
          retry-limit: 1
        on: {ok: parse, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled}
      parse:
        use: parse-specification-omission-repair
        on: {ok: release, failed: end.failed}
      release:
        call: release-request
        on: {ok: merge, failed: end.failed}
      merge:
        use: merge-specification-omission-repair
        with:
          retry-limit: 64
        on: {ok: end.ok, failed: end.failed}
  generation-clarifications:
    start: build-clarification
    steps:
      build-clarification:
        use: build-specification-clarification-need
        on: {ok: refresh-clarifications, failed: end.failed}
      refresh-clarifications:
        use: refresh-clarifications
        on: {ok: publish-clarifications, blocked: end.blocked, failed: end.failed}
      publish-clarifications:
        call: clarification-output
        on: {ok: end.ok, needs-user: end.needs-user, blocked: end.blocked, failed: end.failed}
