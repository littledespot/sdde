schema: workflow/v1
id: toolchain-check
version: 1
shortcode: TOOL
invoke: core.empty-invocation
policy: core.toolchain@1
start: capture-project
steps:
  capture-project: { use: capture-project-toolchain, on: { ok: inventory-presets, failed: end.failed } }
  inventory-presets: { use: inventory-toolchain-presets, on: { ok: capture-presets, failed: end.failed } }
  capture-presets: { use: capture-toolchain-presets, on: { ok: parse, failed: end.failed } }
  parse: { use: parse-toolchain-documents, on: { ok: validate-project, failed: end.failed } }
  validate-project: { use: validate-project-toolchain-schema, on: { ok: validate-registry, failed: end.failed } }
  validate-registry: { use: validate-toolchain-preset-registry, on: { ok: inherit, failed: end.failed } }
  inherit: { use: resolve-toolchain-inheritance, on: { ok: compose, failed: end.failed } }
  compose: { use: compose-toolchain, on: { ok: validate-safety, failed: end.failed } }
  validate-safety: { use: validate-toolchain-safety, on: { ok: end.ok, failed: end.failed } }
