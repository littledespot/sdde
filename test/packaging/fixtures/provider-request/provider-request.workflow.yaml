schema: workflow/v1
id: provider-request
version: 1
shortcode: MODL
invoke: core.empty-invocation
policy: core.model-inference@1
start: initialize
resources: { prompt: provider-request.prompt.md, input: provider-request.input.txt, result: provider-request.schema.json }
steps:
  initialize: { use: build-initial-model-request-identity-ledger, on: { ok: request, failed: end.failed } }
  request:
    use: request-model
    with: { slot: spec_generation, prompt: prompt, input: input, result-schema: result, retry-limit: 0 }
    on: { ok: release, invalid: end.invalid, failed: end.failed, cancelled: end.cancelled }
  release: { use: release-model-request, on: { ok: end.ok, failed: end.failed } }
